[pytest]
# Flash QA harness. Runs ON THE SERVER only, via `make qa-remote` (ADR-018, REQ-009).
# Run from the qa/ directory (the runner does this in /srv/flash/qa/suite/).
testpaths = api smoke e2e
pythonpath = .
python_files = test_*.py
# importlib mode: no __init__.py needed, test basenames may repeat across folders.
# --tracing off / --video off: a Playwright trace records typed values (passwords), so it is banned.
# Screenshots on failure are taken by e2e/conftest.py (password fields render masked).
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --tb=short
    --junitxml=.results/junit.xml
    --browser chromium
    --tracing off
    --video off
    --output .results/playwright
    -p no:cacheprovider
junit_family = xunit2
junit_logging = no
# Evidence log: request method, path (never the query string) and status only.
log_file = .results/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_level = WARNING
markers =
    smoke: fast post-deploy checks (status, health, readiness, web root)
    regression: part of the regression baseline (run on every release)
    security: auth, permissions, secrets hygiene, TLS, headers
    ratelimit: rate-limit (429) tests; deselected unless -m selects them explicitly; run LAST with `make throttle-reset` before and after
    deploy: deployment checks against the server runtime (TLS, nginx, systemd, layout, dental non-interference)
    e2e: Playwright browser tests against the PWA (Chromium, headless, one worker)
