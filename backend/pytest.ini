[pytest]
# config.settings.test extends development with isolated test values
# (LocMem cache, fast hashing, test-only app). --ds wins over an exported
# DJANGO_SETTINGS_MODULE so the server runner always gets the test settings.
DJANGO_SETTINGS_MODULE = config.settings.test
addopts = --ds=config.settings.test --strict-markers -ra
python_files = tests.py test_*.py *_tests.py
testpaths = tests common apps
markers =
    ratelimit: rate-limit (throttling) tests
